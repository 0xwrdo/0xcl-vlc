      - name: Download VLC (runtime + SDK)
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $ok = $false
          foreach ($v in @("3.0.21","3.0.20","3.0.19","3.0.18")) {
            foreach ($base in @("https://download.videolan.org/pub/videolan/vlc","https://get.videolan.org/vlc")) {
              $url = "$base/$v/win64/vlc-$v-win64.zip"
              Write-Host "Trying $url"
              try {
                Invoke-WebRequest $url -OutFile vlc.zip -UserAgent "Mozilla/5.0" -MaximumRedirection 10
                if ((Get-Item vlc.zip).Length -gt 20MB) {
                  $ok = $true
                  "VLC_VERSION=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
                  break
                }
              } catch { Write-Host "Failed: $($_.Exception.Message)" }
            }
            if ($ok) { break }
          }
          if (-not $ok) { throw "Could not download VLC from any mirror" }
          Expand-Archive vlc.zip -DestinationPath vlc
          Get-ChildItem vlc
